[project]
name = "render-ceiling"
version = "1.0.0"
description = "A model-free ceiling for vision-language model evaluation on rendered crystal structures"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Can Polat" },
    { name = "Mustafa Kurban", email = "kurbanm@ankara.edu.tr" },
    { name = "Erchin Serpedin" },
    { name = "Hasan Kurban", email = "hkurban@hbku.edu.qa" },
]
keywords = [
    "vision-language models",
    "crystal structures",
    "benchmark",
    "evaluation",
    "geometric oracle",
]
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "matplotlib==3.11.0",
    "pymatgen==2026.5.4",
    "spglib==2.7.0",
    "ase==3.29.0",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
# Only needed to fetch source structures from the Materials Project.
fetch = ["mp-api==0.46.4"]

[project.scripts]
render-ceiling = "render_ceiling.cli:main"

[project.urls]
Repository = "https://github.com/KurbanIntelligenceLab/render-ceiling"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/render_ceiling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
