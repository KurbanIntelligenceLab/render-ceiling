# Hooks run the same commands as CI, so the two cannot drift apart.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy src/render_ceiling
        language: system
        types: [python]
        pass_filenames: false
      - id: verify
        name: render-ceiling verify
        entry: uv run render-ceiling verify
        language: system
        pass_filenames: false
